# OpenAny release: build the desktop app and attach it to a GitHub Release.
#
# Independent of upstream's `release.yml`, which triggers on `v*` and publishes
# to npm. This one triggers on `openany-v*` and never publishes a package: it
# builds the macOS desktop app unsigned and creates a draft GitHub Release on
# this fork.
#
# Unverified scaffold: the first run may need iteration (runner image, bundled
# OpenCode CLI step, artifact paths). Failures only leave the draft unbuilt.

name: OpenAny Release

on:
  push:
    tags:
      - 'openany-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., openany-v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build web assets
        run: bun run --cwd packages/electron build:web-assets
      - name: Prepare bundled OpenCode CLI
        run: bun run --cwd packages/electron prepare:opencode-cli
      - name: Bundle Electron main
        run: bun run --cwd packages/electron bundle:main
      - name: Rebuild native modules
        run: bun run --cwd packages/electron rebuild:native
      - name: Package (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: bun run --cwd packages/electron package -- --publish never -c.mac.notarize=false
      - name: Attach artifacts to a draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            packages/electron/dist/*.dmg
            packages/electron/dist/*.zip
