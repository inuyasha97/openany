# OpenAny release: build the desktop app on macOS, Windows and Linux, then
# attach every artifact to a draft GitHub Release.
#
# Independent of upstream's `release.yml`, which triggers on `v*` and publishes
# to npm. This one triggers on `openany-v*` and never publishes a package: each
# OS builds its installer unsigned, and one release job collects them.
#
# Unverified scaffold beyond macOS (the first macOS run needed a fix). Windows
# and Linux may need iteration (native rebuild, artifact paths).

name: OpenAny Release

on:
  push:
    tags:
      - 'openany-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., openany-v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            package_args: '--publish never -c.mac.notarize=false'
          - os: windows-latest
            package_args: '--publish never'
          - os: ubuntu-latest
            package_args: '--publish never'
    runs-on: ${{ matrix.os }}
    env:
      # No signing certificates on the fork; build unsigned installers.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build web assets
        run: bun run --cwd packages/electron build:web-assets
      - name: Prepare bundled OpenCode CLI
        run: bun run --cwd packages/electron prepare:opencode-cli
      - name: Bundle Electron main
        run: bun run --cwd packages/electron bundle:main
      - name: Rebuild native modules
        run: bun run --cwd packages/electron rebuild:native
      - name: Package (unsigned)
        run: bun run --cwd packages/electron package -- ${{ matrix.package_args }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: openany-${{ matrix.os }}
          if-no-files-found: error
          path: |
            packages/electron/dist/*.dmg
            packages/electron/dist/*.zip
            packages/electron/dist/*.exe
            packages/electron/dist/*.AppImage

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect installers
        uses: actions/download-artifact@v4
        with:
          pattern: openany-*
          merge-multiple: true
          path: installers
      - name: Create or update the draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: installers/**
