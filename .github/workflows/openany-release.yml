# OpenAny release: build the desktop app for both macOS architectures, Windows
# and Linux, then attach every artifact to a draft GitHub Release.
#
# Independent of upstream's `release.yml` (which triggers on `v*` and publishes
# packages). This one triggers on `openany-v*` and never publishes a package:
# each target builds its installer unsigned — the fork ships no signing
# certificates.
#
# The update manifests are part of the upload: without `latest*.yml` the
# packaged app can check for updates but can never find one. macOS needs both
# architectures' manifests merged into one file, which is why the per-arch
# manifest travels as its own artifact and a separate job combines them.

name: OpenAny Release

on:
  push:
    tags:
      - 'openany-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., openany-v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            package_args: '--mac --arm64 --publish never -c.mac.notarize=false'
          - os: macos-15-intel
            target: x86_64-apple-darwin
            package_args: '--mac --x64 --publish never -c.mac.notarize=false'
          # windows-latest resolves to a runner whose Visual Studio the
          # electron/node-gyp stack does not detect, so the native rebuild fails
          # there; pin the last known-good image.
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            package_args: '--win --x64 --publish never'
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package_args: '--linux --x64 --publish never'
    runs-on: ${{ matrix.os }}
    env:
      # No signing certificates on the fork; build unsigned installers.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # `package` runs the whole chain: build the web UI, verify the staged
      # assets, build @openchamber/omp-adapter, stage the pinned OMP binary,
      # bundle the Electron main process, rebuild native modules, then run
      # electron-builder.
      - name: Package (unsigned)
        run: bun run --cwd packages/electron package -- ${{ matrix.package_args }}
      # The AppImage is the one target whose payload this repo can check end to
      # end: desktop identity, bundled OMP CLI version and architecture, and
      # every native module.
      - name: Verify Linux AppImage
        if: runner.os == 'Linux'
        run: bun run --cwd packages/electron verify:linux-appimage
      - name: Verify the Linux update manifest matches the AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/electron/package.json').version")
          node packages/electron/scripts/verify-update-manifest.mjs \
            "packages/electron/dist/latest-linux.yml" \
            "$(ls packages/electron/dist/*.AppImage)" \
            "$VERSION"
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: openany-${{ matrix.target }}
          if-no-files-found: error
          path: |
            packages/electron/dist/*.dmg
            packages/electron/dist/*.zip
            packages/electron/dist/*.exe
            packages/electron/dist/*.AppImage
            packages/electron/dist/*.blockmap
            packages/electron/dist/latest.yml
            packages/electron/dist/latest-linux.yml
      # macOS ships one merged manifest, so its per-arch files travel
      # separately and never reach the release on their own.
      - name: Upload the per-arch macOS manifest for merging
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: latest-yml-${{ matrix.target }}
          if-no-files-found: error
          path: packages/electron/dist/latest-mac.yml

  merge-mac-manifests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download the per-arch macOS manifests
        uses: actions/download-artifact@v4
        with:
          pattern: latest-yml-*-apple-darwin
          path: artifacts
      - name: Read the release version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./packages/electron/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Merge them into one latest-mac.yml
        env:
          MAC_ONLY: '1'
          LATEST_YML_DIR: ${{ github.workspace }}/artifacts
          GH_REPO: ${{ github.repository }}
          OPENCHAMBER_VERSION: ${{ steps.version.outputs.value }}
        run: node packages/electron/scripts/finalize-latest-yml.mjs
      - name: Upload the merged manifest
        uses: actions/upload-artifact@v4
        with:
          name: openany-mac-manifest
          if-no-files-found: error
          path: ${{ runner.temp }}/latest-mac.yml

  release:
    needs: [build, merge-mac-manifests]
    runs-on: ubuntu-latest
    steps:
      - name: Collect every artifact
        uses: actions/download-artifact@v4
        with:
          pattern: openany-*
          merge-multiple: true
          path: installers
      - name: Create or update the draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: installers/**
