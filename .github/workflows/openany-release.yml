# OpenAny release: build the desktop app on macOS, Windows and Linux, then
# attach every artifact to a draft GitHub Release.
#
# Independent of upstream's `release.yml` (which triggers on `v*` and publishes
# packages). This one triggers on `openany-v*` and never publishes a package:
# each OS builds its installer unsigned — the fork ships no signing
# certificates — and one release job collects them.
#
# The update manifests are part of the upload: without `latest*.yml` the
# packaged app can check for updates but can never find one.

name: OpenAny Release

on:
  push:
    tags:
      - 'openany-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., openany-v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            package_args: '--publish never -c.mac.notarize=false'
          - os: windows-latest
            package_args: '--publish never'
          - os: ubuntu-latest
            package_args: '--publish never'
    runs-on: ${{ matrix.os }}
    env:
      # No signing certificates on the fork; build unsigned installers.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # `package` runs the whole chain: build the web UI, verify the staged
      # assets, build @openchamber/omp-adapter, stage the pinned OMP binary,
      # bundle the Electron main process, rebuild native modules, then run
      # electron-builder.
      - name: Package (unsigned)
        run: bun run --cwd packages/electron package -- ${{ matrix.package_args }}
      # The AppImage is the one target whose payload this repo can check end to
      # end: desktop identity, bundled OMP CLI version and architecture, and
      # every native module.
      - name: Verify Linux AppImage
        if: runner.os == 'Linux'
        run: bun run --cwd packages/electron verify:linux-appimage
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: openany-${{ matrix.os }}
          if-no-files-found: error
          path: |
            packages/electron/dist/*.dmg
            packages/electron/dist/*.zip
            packages/electron/dist/*.exe
            packages/electron/dist/*.AppImage
            packages/electron/dist/*.yml
            packages/electron/dist/*.blockmap

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect installers
        uses: actions/download-artifact@v4
        with:
          pattern: openany-*
          merge-multiple: true
          path: installers
      - name: Create or update the draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: installers/**
